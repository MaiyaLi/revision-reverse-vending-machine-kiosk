# Frigate configuration for ReVision RVM Kiosk
# Surveillance camera (CSI-0) - motion-triggered recording
# Camera stream is served by rpicam-vid on the host via UDP

# go2rtc: Read camera stream from host-side rpicam-vid UDP output
go2rtc:
  streams:
    surveillance:
      # rpicam-vid on host streams H264 over UDP to 127.0.0.1:8554
      - "udp://127.0.0.1:8554"

# CPU-only detectors for Raspberry Pi
detectors:
  cpu1:
    type: cpu
  cpu2:
    type: cpu

model:
  width: 320
  height: 320
  labelmap: coco
  labelcast_filter: true

cameras:
  surveillance:
    ffmpeg:
      inputs:
        - path: rtsp://localhost:8554/surveillance
          roles:
            - detect
            - record
    width: 640
    height: 480
    fps: 15

    objects:
      track:
        - person
      filters:
        person:
          min_area: 5000
          max_area: 100000
          min_score: 0.5
          max_score: 0.9999
          min_hit_inertia: 0.2
          max_hit_inertia: 0.5

    motion:
      enabled: true
      width: 640
      height: 480
      fps: 15
      max_disappeared: 25
      min_movement: 30
      stationary:
        interval: 10
        distance: 1
        max_update: 0

    record:
      enabled: true
      clip_duration: 10
      expire_days: 7
      retain_days: 7

    snapshots:
      enabled: true
      timestamp: false
      bounding_box: true
      crop: true
      height: 1080
      retain:
        default: 14

webserver:
  port: 5000
  url: ""

live:
  stream_resolution: 1080
  bounding_box: true
  quality: 80

ffmpeg:
  output:
    - '-segflags', '+faststart'
    - '-tune', 'zerolatency'
    - '-movflags', '+faststart'
    - '-profile:v', 'main'
    - '-preset', 'superfast'
    - '-threads', '2'
  output_args:
    - '-f', 'segment'
    - '-segment_time', '10'
    - '-reset_timestamps', '1'
    - '-strftime', '1'
    - '-c:v', 'libx264'
    - '-preset', 'superfast'
    - '-tune', 'zerolatency'
    - '-r', '4'
