version: "3.9"
services:
  frigate:
    container_name: frigate
    privileged: true
    restart: unless-stopped
    image: ghcr.io/blakeblackshear/frigate:stable
    environment:
      FRIGATE_RTSP_PASSWORD: ""
      ENABLE_RTSP: "true"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      - frigate_clips:/media/frigate/clips
      - frigate_recordings:/media/frigate/recordings
      - frigate_backup:/media/frigate/backups
      # Pi camera devices
      - /dev:/dev
      - /dev/vchiq:/dev/vchiq
      - /dev/vcsm:/dev/vcsm
      - /dev/dri:/dev/dri
    devices:
      - /dev/vchiq:/dev/vchiq
      - /dev/dri:/dev/dri
      - /dev/media0:/dev/media0
      - /dev/media1:/dev/media1
      - /dev/media4:/dev/media4
      - /dev/video11:/dev/video11
    ports:
      - "5000:5000"
      - "1935:1935"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    tmpfs:
      - /tmp/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: v4l2
              count: 1
              capabilities: [video]

volumes:
  frigate_clips:
  frigate_recordings:
  frigate_backup:
